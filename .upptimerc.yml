owner: Sabari-Vijayan
repo: status.app.ktu.in

workflowSchedule:
  responseTime: "0 * * * *"

sites:
  - name: KTU Main Website
    url: https://ktu.edu.in
    __dangerous__disable_verify_peer: true
    __dangerous__body_down: "Internal Server Error"
  - name: e-Governance Portal
    url: https://app.ktu.edu.in
    __dangerous__disable_verify_peer: true
  - name: Results Portal
    url: https://ktu.edu.in/eu/ex/result.htm
    __dangerous__disable_verify_peer: true
  - name: Certificate Verification
    url: https://ktu.edu.in/eu/auth/verification.htm
    __dangerous__disable_verify_peer: true
  - name: Academic Calendar
    url: https://ktu.edu.in/eu/acad/academicCalendar.htm
    __dangerous__disable_verify_peer: true

status-website:
  # Crucial: Leading and trailing slashes are required for sub-folders
  baseUrl: /status.app.ktu.in
  # UI Theme
  theme: light
  # Page Title
  name: KTU Status Dashboard
  metaDescription: "Real-time status and uptime monitoring for APJ Abdul Kalam Technological University (KTU) portals including the Main Website, e-Governance Portal, and Results Portal."
  # Using the new logo as the social preview image
  metaImage: https://raw.githubusercontent.com/Sabari-Vijayan/status.app.ktu.in/master/assets/ktu-status-logo-1.svg
  metaTags:
    - name: "theme-color"
      content: "#34c759"
    - name: "robots"
      content: "index, follow"
  # Logo (using local asset)
  logoUrl: https://raw.githubusercontent.com/Sabari-Vijayan/status.app.ktu.in/master/assets/ktu-status-logo-1.svg
  # Intro
  introTitle: "**KTU Services** Live Status"
  introMessage: "Real-time monitoring for APJ Abdul Kalam Technological University (KTU) official portals. This dashboard tracks uptime and response times to help students and faculty stay informed.\n\nMade with pure spite 💚 [Contribute on GitHub](https://github.com/Sabari-Vijayan/status.app.ktu.in)"
  # Navigation
  navbar:
    - title: Status
      href: /
    - title: KTU Website
      href: https://ktu.edu.in
    - title: Student Login
      href: https://app.ktu.edu.in
    - title: GitHub
      href: https://github.com/Sabari-Vijayan/status.app.ktu.in
